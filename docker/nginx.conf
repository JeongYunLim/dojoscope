server {
    listen 7680;
    server_name _;
    # AgentDojo trace JSON 업로드가 클 수 있어 여유 있게 잡음.
    client_max_body_size 50m;

    location = /favicon.ico {
        root /usr/share/nginx/html;
        access_log off;
        try_files /favicon.ico =404;
    }

    # 캐시 없이 항상 서버에 다시 확인하게 한다 — app.js/index.html에 캐시
    # 방지 헤더가 없으면 배포할 때마다 브라우저가 예전 버전을 계속 보여줄 수
    # 있다(실제로 이 문제 때문에 방금 고친 기능이 반영 안 된 것처럼 보이는
    # 문제를 겪었다). 파일이 작아서(수십 KB) 매번 다시 받아도 비용이 적다.
    location / {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # 백엔드는 이 컨테이너 네트워크 안에서만 보이고(docker-compose.yml에 ports
    # 없음) /api/* 요청만 nginx가 대신 넘겨준다.
    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 업로드 후 파이프라인(임베딩→DTW→UMAP→군집화) 재계산이 데이터 크기에
        # 따라 수십 초 걸릴 수 있어 기본 60s보다 넉넉하게 잡음.
        proxy_read_timeout 300s;
        proxy_pass http://backend:7601;
    }
}
