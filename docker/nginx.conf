server {
    listen 7680;
    server_name _;
    # AgentDojo trace JSON 업로드가 클 수 있어 여유 있게 잡음.
    client_max_body_size 50m;

    location = /favicon.ico {
        root /usr/share/nginx/html;
        access_log off;
        try_files /favicon.ico =404;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # 백엔드는 이 컨테이너 네트워크 안에서만 보이고(docker-compose.yml에 ports
    # 없음) /api/* 요청만 nginx가 대신 넘겨준다.
    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 업로드 후 파이프라인(임베딩→DTW→UMAP→군집화) 재계산이 데이터 크기에
        # 따라 수십 초 걸릴 수 있어 기본 60s보다 넉넉하게 잡음.
        proxy_read_timeout 300s;
        proxy_pass http://backend:7601;
    }
}
